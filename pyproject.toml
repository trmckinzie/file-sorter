[project]
name = "file-sorter"
version = "0.1.0"
description = "A safe, configurable CLI tool for organizing cluttered directories (e.g. ~/Downloads) into structured category folders."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pyyaml>=6.0",
    "pydantic>=2.6.0",
]

[project.scripts]
file-sorter = "sorter.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[tool.setuptools.packages.find]
include = ["sorter*"]

[tool.setuptools.package-data]
sorter = ["default_config.yaml"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
